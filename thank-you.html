<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you — LIA</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/favicon/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/assets/favicon/apple-touch-icon.png">
<style>
[hidden]{display:none!important}
@font-face{font-family:"Cormorant Garamond";src:url(/assets/fonts/cormorant-garamond.woff2) format("woff2");font-weight:300 700;font-display:swap}
@font-face{font-family:"Manrope";src:url(/assets/fonts/manrope.woff2) format("woff2");font-weight:200 800;font-display:swap}
:root{--charcoal:#1F2A23;--olive:#3E4A3F;--offwhite:#F8F6F2;--muted:#5B6158}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:var(--offwhite);color:var(--charcoal);font-family:"Manrope","Helvetica Neue",Arial,sans-serif;text-align:center;line-height:1.6}
main{max-width:34rem;display:grid;gap:24px;justify-items:center}
img{width:96px;height:auto}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:clamp(36px,6vw,56px);line-height:1.1;margin:16px 0 0}
p{margin:0;color:var(--muted)}
a{display:inline-flex;align-items:center;min-height:48px;padding:0 26px;border-radius:3px;background:var(--olive);color:var(--offwhite);text-decoration:none;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
a:focus-visible{outline:2px solid var(--olive);outline-offset:3px}
</style>
</head>
<body>
<main>
  <img src="/assets/branding/lia-wordmark.svg" alt="LIA" width="96" height="64">
  <h1>Thank you.</h1>
  <p>Your request has reached Lia. She’ll be in touch personally to arrange a time.</p>
  <a href="/">Back to the site</a>
</main>
</body>
</html>
