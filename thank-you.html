<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you — LIA</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Hanken+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
:root{--charcoal:#1F2A23;--olive:#3E4A3F;--offwhite:#F8F6F2;--muted:#5B6158}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:var(--offwhite);color:var(--charcoal);font-family:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;text-align:center;line-height:1.6}
main{max-width:34rem;display:grid;gap:24px;justify-items:center}
img{width:200px;height:auto}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:300;font-size:clamp(36px,6vw,56px);line-height:1.1;margin:16px 0 0}
p{margin:0;color:var(--muted)}
a{display:inline-flex;align-items:center;min-height:52px;padding:0 32px;border-radius:999px;background:var(--olive);color:var(--offwhite);text-decoration:none;font-size:12px;font-weight:500;letter-spacing:.22em;text-transform:uppercase}
a:focus-visible{outline:2px solid var(--olive);outline-offset:3px}
</style>
</head>
<body>
<main>
  <img src="/assets/branding/lia-logo-dark.svg" alt="LIA — Pilates, Mobility, Neuromovement">
