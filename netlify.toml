# Static site, no build step. Netlify publishes the repository root.
[build]
  publish = "."
  command = ""

# Only fonts are cached long-term. Everything else revalidates (Netlify default),
# so replaced photos and styles show up immediately.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
